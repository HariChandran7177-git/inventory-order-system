services:
  postgres:
    image: postgres:16-alpine
    container_name: fastcart-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DATABASE:-postgres}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME:-postgres} -d ${POSTGRES_DATABASE:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fastcart-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  inventory-api:
    build:
      context: ./backend/inventory
      dockerfile: Dockerfile
    container_name: fastcart-inventory-api
    restart: unless-stopped
    command: ["uvicorn", "inventory.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${INVENTORY_API_PORT:-8000}:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  inventory-consumer:
    build:
      context: ./backend/inventory
      dockerfile: Dockerfile
    container_name: fastcart-inventory-consumer
    restart: unless-stopped
    command: ["python", "-m", "inventory.app.workers.consumer"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    depends_on:
      redis:
        condition: service_healthy
      inventory-api:
        condition: service_healthy

  payment-api:
    build:
      context: ./backend/payment
      dockerfile: Dockerfile
    container_name: fastcart-payment-api
    restart: unless-stopped
    command: ["uvicorn", "payment.app.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "${PAYMENT_API_PORT:-8001}:8001"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      INVENTORY_SERVICE_URL: http://inventory-api:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      inventory-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  payment-consumer:
    build:
      context: ./backend/payment
      dockerfile: Dockerfile
    container_name: fastcart-payment-consumer
    restart: unless-stopped
    command: ["python", "-m", "payment.app.workers.consumer"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      payment-api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fastcart-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_PAYMENT_API_URL: ${VITE_PAYMENT_API_URL:-http://localhost:8001}
    depends_on:
      inventory-api:
        condition: service_healthy
      payment-api:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
